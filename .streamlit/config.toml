# Must live in .streamlit/config.toml (with the dot) or Streamlit ignores it.

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#111827"
font = "sans serif"

[server]
# Uploaded files are written to disk and released from memory right after
# upload. While a file is arriving, though, Streamlit holds all of it in
# memory, and Community Cloud gives the whole app 2.7 GB; 1 GB per file
# leaves room for the analysis.
maxUploadSize = 1024

[browser]
gatherUsageStats = false
