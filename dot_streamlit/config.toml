# Theming is done here rather than with CSS overrides.
# Setting the base theme natively means Streamlit styles its own widgets
# correctly, so the app no longer needs blanket `!important` rules that
# broke multiselect chips, clear buttons and checkboxes.

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#111827"
font = "sans serif"

[server]
maxUploadSize = 2048

[browser]
gatherUsageStats = false
